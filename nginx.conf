server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Compression gzip
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Pas de cache : à chaque requête, le navigateur vérifie si le fichier a changé
    add_header Cache-Control "no-cache";

    # Routing SPA : toutes les routes inconnues renvoient index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}